server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

static:
  directory: "web"
  cache_max_age: "3600"

middleware:
  enable_cors: true
  enable_compression: true

logging:
  level: "info"
  enable_request_logging: true

tasks:
  max_tasks: 10000
  enable_persistence: false
  persistence_file: "tasks.json"
