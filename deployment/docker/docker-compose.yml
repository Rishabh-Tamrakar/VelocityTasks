version: '3.8'

services:
  # VelocityTasks Application
  velocitytasks:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: velocitytasks-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - STATIC_DIR=web
      - LOG_LEVEL=info
      - MAX_TASKS=10000
      - ENABLE_PERSISTENCE=true
      - PERSISTENCE_FILE=/data/tasks.json
    volumes:
      - velocitytasks_data:/data
    networks:
      - velocitytasks_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.velocitytasks.rule=Host(`velocitytasks.localhost`)"
      - "traefik.http.services.velocitytasks.loadbalancer.server.port=8080"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: velocitytasks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web:/var/www/velocitytasks:ro
      # Uncomment for SSL
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - velocitytasks
    networks:
      - velocitytasks_network
    command: ["nginx", "-g", "daemon off;"]

  # Redis for Session Storage (Optional)
  redis:
    image: redis:7-alpine
    container_name: velocitytasks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - velocitytasks_redis:/data
    networks:
      - velocitytasks_network
    command: redis-server --appendonly yes
    profiles:
      - with-redis

  # Prometheus for Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: velocitytasks-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - velocitytasks_prometheus:/prometheus
    networks:
      - velocitytasks_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana for Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: velocitytasks-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - velocitytasks_grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - velocitytasks_network
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  velocitytasks_data:
    driver: local
  velocitytasks_redis:
    driver: local
  velocitytasks_prometheus:
    driver: local
  velocitytasks_grafana:
    driver: local

networks:
  velocitytasks_network:
    driver: bridge
